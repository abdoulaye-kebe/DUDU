name: mobile_dudu_pro
description: "DUDU Pro - Application pour les chauffeurs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  http: ^1.5.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  socket_io_client: ^3.1.2
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.1
  url_launcher: ^6.3.0
  flutter_webrtc: ^0.12.4
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo_dudu_off.png
    - assets/images/payments/
  
  # Police Poppins
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
